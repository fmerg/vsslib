image: node:22

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

check:
  script:
    - npm run lint
    - npm run typecheck

test:
  script:
    - ./test.sh
  artifacts:
    when: always
    reports:
      junit: coverage/junit.xml
